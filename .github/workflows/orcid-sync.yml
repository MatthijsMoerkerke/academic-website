name: Sync ORCID and Scholar

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pyyaml python-slugify markdown

      - name: Install wkhtmltopdf
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf

      - name: Sync ORCID publications
        run: python scripts/orcid_sync.py

      - name: Update Scholar metrics
        run: python scripts/update_scholar.py
        continue-on-error: true

      - name: Show Scholar metrics
        run: |
          echo "Contents of data/scholar.yaml:"
          cat data/scholar.yaml

      - name: Generate CV HTML
        run: python scripts/build_cv.py

      - name: Generate CV PDF
        run: |
          mkdir -p static/uploads
          wkhtmltopdf \
            --enable-local-file-access \
            cv/cv_generated.html \
            static/uploads/CV_Matthijs_Moerkerke.pdf

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add content/publications
          git add data/scholar.yaml
          git add cv/cv_generated.html
          git add static/uploads/CV_Matthijs_Moerkerke.pdf

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update publications, Scholar metrics, and CV"
            git push
          fi

      - name: Trigger Hugo deploy workflow
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run hugo.yml
